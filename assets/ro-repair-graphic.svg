<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="waterFlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="24" fill="url(#bgGrad)" />
  
  <!-- Grid accents -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="400" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="350" y1="0" x2="350" y2="400" />
    <line x1="450" y1="0" x2="450" y2="400" />
    <line x1="550" y1="0" x2="550" y2="400" />
    <line x1="0" y1="100" x2="600" y2="100" />
    <line x1="0" y1="200" x2="600" y2="200" />
    <line x1="0" y1="300" x2="600" y2="300" />
  </g>

  <!-- RO Purifier Unit Body -->
  <g transform="translate(80, 50)">
    <rect x="0" y="0" width="220" height="300" rx="20" fill="#ffffff" stroke="#38bdf8" stroke-width="3" />
    <!-- Transparent Tank Window -->
    <rect x="25" y="120" width="170" height="140" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" />
    <!-- Water level in tank -->
    <rect x="26" y="150" width="168" height="108" rx="12" fill="url(#waterFlow)" />
    <path d="M26 150 Q70 145 110 150 T194 150 L194 258 L26 258 Z" fill="#0284c7" opacity="0.5" />
    <text x="110" y="205" font-family="sans-serif" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">PURE WATER TANK</text>
    <text x="110" y="225" font-family="sans-serif" font-size="11" fill="#e0f2fe" text-anchor="middle">TDS: 115 PPM • PURE</text>

    <!-- Top Filter Chamber (Open inspection view) -->
    <rect x="25" y="25" width="170" height="80" rx="10" fill="#0f172a" />
    <!-- Filter cartridges visible inside -->
    <rect x="40" y="35" width="35" height="60" rx="6" fill="#0284c7" />
    <rect x="92" y="35" width="35" height="60" rx="6" fill="#06b6d4" />
    <rect x="145" y="35" width="35" height="60" rx="6" fill="#10b981" />
    <!-- Purifier Tap -->
    <path d="M110 260 L110 280 L100 285" stroke="#64748b" stroke-width="6" stroke-linecap="round" fill="none" />
    <!-- Pure droplet -->
    <circle cx="98" cy="295" r="4" fill="#38bdf8" />
  </g>

  <!-- Service Engineer & Precision Diagnostic Equipment -->
  <g transform="translate(340, 60)">
    <!-- Live Diagnostic Digital Meter Badge -->
    <rect x="0" y="20" width="210" height="75" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <circle cx="25" cy="57" r="8" fill="#10b981" />
    <text x="42" y="45" font-family="sans-serif" font-size="11" font-weight="bold" fill="#94a3b8">DIGITAL TDS CALIBRATION</text>
    <text x="42" y="72" font-family="sans-serif" font-size="24" font-weight="bold" fill="#34d399">112 PPM <tspan font-size="12" fill="#a7f3d0">✓ OPTIMAL</tspan></text>

    <!-- 30-Minute Dispatch Badge -->
    <rect x="0" y="115" width="210" height="70" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text x="20" y="143" font-family="sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">⚡ 30-MIN RESPONSE</text>
    <text x="20" y="166" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">LUCKNOW EXPRESS RO</text>

    <!-- Verified Spares Kit Badge -->
    <rect x="0" y="205" width="210" height="75" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <text x="20" y="232" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fbbf24">🛡️ 100% GENUINE SPARES</text>
    <text x="20" y="255" font-family="sans-serif" font-size="13" fill="#e2e8f0">Filmtec Membrane • Copper Pump</text>
    <text x="20" y="270" font-family="sans-serif" font-size="11" fill="#94a3b8">30 Days Guarantee • Starting ₹199</text>
  </g>
</svg>